<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="ttl ds">
<title id="ttl">reastream measured compression of analysis output</title>
<desc id="ds">One REA 6.1.0 file: 1.264 gigabytes on disk, streamed into a 6.55 megabyte evidence-bearing projection of 19,962 records. Kept output is approximately 0.52 percent of on-disk input, drawn to scale.</desc>
<rect width="920" height="390" rx="16" fill="#FCFCFA"/>
<text x="38" y="39" fill="#64748B" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">REASTREAM / ONE MEASURED RUN</text>
<text x="38" y="92" fill="#17242F" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">1.26 GB in. 6.55 MB kept.</text>
<text x="38" y="124" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="18">A streaming reader kept the evidence fields. It left the giant graph behind.</text>
<text x="38" y="178" fill="#17242F" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">Source file</text>
<text x="882" y="178" text-anchor="end" fill="#17242F" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">1,264,678,208 bytes</text>
<rect x="38" y="193" width="844" height="29" rx="6" fill="#263A48"/>
<text x="38" y="273" fill="#17242F" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">Projected records</text>
<text x="882" y="273" text-anchor="end" fill="#17242F" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">6,547,610 bytes</text>
<rect x="38" y="288" width="844" height="29" rx="6" fill="#E5EAEF"/>
<rect x="38" y="288" width="4.370" height="29" rx="2" fill="#147D77"/>
<circle cx="41" cy="302.5" r="5" fill="#147D77"/>
<line x1="46" y1="302" x2="211" y2="302" stroke="#147D77" stroke-width="2" stroke-dasharray="5 4"/>
<text x="222" y="307" fill="#147D77" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">0.52% of the on-disk input</text>
<line x1="38" y1="343" x2="882" y2="343" stroke="#DCE3EA" stroke-width="1.5"/>
<text x="38" y="370" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="16">UTF-16LE source</text>
<text x="319" y="370" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="16">19,962 records</text>
<text x="657" y="370" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="16">110 s / release build</text>
</svg>